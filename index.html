<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="icon" sizes="32x32" type="image/png" href="/images/spotify-logo-green.png"/>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/fontawesome/fontawesome-free-6.7.2-web/css/all.css">
</head>
<body>
    <header>
        <div class="spotify-logo">
            <img src="/images/spotify-logo-white.png" alt="spotify-logo">
        </div>

        <div class="home-logo">
            <img src="/images/hut.png" alt="home-logo">
        </div>

        <div class="search-bar">
            <label id="magnifying-glass"for="search-input"><i class="fa-solid fa-magnifying-glass"></i></label>
            <input type="text" id="search-input" placeholder="¿Qué quieres reproducir?">
            <label id="explore-button"for="search-input"><i class="fa-solid fa-bars"></i></label>
        </div>

        <div></div>
    </header>
</body>
</html>
